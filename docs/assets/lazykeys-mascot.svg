<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="mascot-title mascot-desc">
  <title id="mascot-title">LazyKeys 小键看板娘</title>
  <desc id="mascot-desc">戴鼠尾草绿键帽头盔、手拿 K 键并挥手的小键，采用与 LazyKeys 标志一致的深灰绿色精密材质。</desc>
  <defs>
    <linearGradient id="lk-key" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5b3e"/>
      <stop offset="0.48" stop-color="#35442d"/>
      <stop offset="1" stop-color="#24301f"/>
    </linearGradient>
    <linearGradient id="lk-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35432c"/>
      <stop offset="1" stop-color="#1b2417"/>
    </linearGradient>
    <linearGradient id="lk-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c0dfa5"/>
      <stop offset="0.46" stop-color="#a6d189"/>
      <stop offset="1" stop-color="#718e5b"/>
    </linearGradient>
    <linearGradient id="lk-skin" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fff0d9"/>
      <stop offset="0.58" stop-color="#f2d7b9"/>
      <stop offset="1" stop-color="#d7b396"/>
    </linearGradient>
    <linearGradient id="lk-cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4137"/>
      <stop offset="0.55" stop-color="#2a3028"/>
      <stop offset="1" stop-color="#1c221b"/>
    </linearGradient>
    <radialGradient id="lk-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#070a06" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#070a06" stop-opacity="0"/>
    </radialGradient>
    <filter id="lk-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <g id="construction" display="none" fill="none" stroke="#8bb9e8" stroke-width="1">
    <rect x="112" y="62" width="196" height="204" rx="48"/>
    <path d="M210 48 Q196 190 211 370"/>
    <ellipse cx="210" cy="292" rx="64" ry="76"/>
    <path d="M148 250 L104 172 M270 252 L330 282"/>
  </g>

  <g id="ground-shadow">
    <ellipse cx="214" cy="378" rx="118" ry="22" fill="url(#lk-shadow)"/>
    <ellipse cx="212" cy="374" rx="70" ry="8" fill="#0c110a" opacity="0.32" filter="url(#lk-soft)"/>
  </g>

  <g id="legs" stroke="#242c20" stroke-width="2" stroke-linejoin="round">
    <path d="M164 323 Q184 316 199 325 L197 363 Q181 373 160 362 Z" fill="url(#lk-cloth)"/>
    <path d="M223 325 Q243 317 259 326 L265 362 Q246 374 224 364 Z" fill="url(#lk-cloth)"/>
    <path d="M159 355 Q180 365 198 357 L198 367 Q178 378 157 366 Z" fill="#171d15"/>
    <path d="M224 357 Q245 366 264 356 L266 366 Q246 378 224 367 Z" fill="#171d15"/>
    <path d="M164 353 Q178 358 190 354" fill="none" stroke="#65745a" stroke-linecap="round"/>
    <path d="M230 354 Q244 359 255 354" fill="none" stroke="#65745a" stroke-linecap="round"/>
  </g>

  <g id="left-arm" stroke="#293123" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M161 248 Q143 247 133 225 L119 195 Q113 181 102 187 Q92 193 99 208 L116 246 Q127 272 153 278 Z" fill="url(#lk-cloth)"/>
    <path d="M104 191 Q92 189 88 177 L84 163 Q82 154 89 151 Q96 148 101 158 L106 168 L106 146 Q107 137 115 138 Q122 139 122 149 L122 168 L128 153 Q132 145 139 149 Q145 153 140 163 L132 183 Q125 201 112 199 Z" fill="url(#lk-skin)"/>
    <path d="M81 133 L73 119 M99 126 L96 108 M119 127 L124 110" fill="none" stroke="#a6d189" stroke-width="4"/>
    <path d="M102 205 Q111 202 118 198" fill="none" stroke="#66745b"/>
  </g>

  <g id="torso" stroke="#283022" stroke-width="2" stroke-linejoin="round">
    <path d="M157 239 Q179 226 207 228 Q240 225 265 242 L271 318 Q254 339 210 340 Q169 339 150 320 Z" fill="url(#lk-cloth)"/>
    <path d="M174 239 Q208 260 247 238 Q237 225 209 225 Q187 225 174 239 Z" fill="#20271d"/>
    <path d="M187 244 L185 264 M231 244 L234 264" fill="none" stroke="#a6d189" stroke-width="3" stroke-linecap="round"/>
    <circle cx="185" cy="267" r="3" fill="#a6d189"/>
    <circle cx="234" cy="267" r="3" fill="#a6d189"/>
    <path d="M171 309 Q210 322 252 307" fill="none" stroke="#4a5542" stroke-linecap="round"/>
    <path d="M165 323 Q185 333 202 333" fill="none" stroke="#59634f" stroke-linecap="round"/>
  </g>

  <g id="right-arm" stroke="#293123" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M255 248 Q275 249 287 268 L300 289 L317 275 L330 292 L312 315 Q303 324 291 313 L266 291 Q254 280 250 267 Z" fill="url(#lk-cloth)"/>
    <path d="M311 275 Q317 264 327 269 L339 279 Q346 286 340 294 L329 302 Q320 306 313 298 L307 289 Z" fill="url(#lk-skin)"/>
  </g>

  <g id="head-keycap" stroke="#26301f" stroke-linejoin="round">
    <path d="M116 102 Q116 63 155 57 L264 57 Q304 63 304 102 L304 218 Q302 250 271 263 L149 263 Q116 252 116 221 Z" fill="url(#lk-side)" stroke-width="3"/>
    <path d="M116 207 Q127 229 150 232 L270 232 Q292 229 304 207 L304 226 Q299 252 270 261 L150 261 Q121 253 116 227 Z" fill="#1d2719" opacity="0.9"/>
    <rect x="116" y="54" width="188" height="184" rx="43" fill="url(#lk-key)" stroke-width="3"/>
    <rect x="124" y="62" width="172" height="168" rx="36" fill="none" stroke="#c4d7b2" stroke-opacity="0.22" stroke-width="2"/>
    <path d="M142 69 Q207 47 275 73" fill="none" stroke="#e1efcf" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
    <path d="M128 206 Q205 229 292 202" fill="none" stroke="#172012" stroke-opacity="0.55" stroke-width="3"/>
  </g>

  <g id="hair-back" stroke="#405334" stroke-width="2" stroke-linejoin="round">
    <path d="M134 111 Q132 68 181 56 Q236 38 275 76 Q300 99 280 137 L270 157 L259 139 L251 178 L230 159 L207 176 L184 155 L160 174 L150 141 Z" fill="url(#lk-hair)"/>
    <path d="M267 97 Q298 101 306 128 Q313 154 293 183 Q278 199 267 184 Q282 161 272 142 Z" fill="#7e9f65"/>
    <path d="M278 118 Q295 139 282 166" fill="none" stroke="#b2d796" stroke-linecap="round"/>
  </g>

  <g id="face" stroke="#5c4b3d" stroke-linejoin="round">
    <path d="M145 118 Q153 98 178 99 L243 99 Q270 103 275 128 L273 184 Q266 216 237 224 L181 224 Q150 216 142 187 Z" fill="url(#lk-skin)" stroke-width="2"/>
    <path d="M151 127 Q163 111 179 110" fill="none" stroke="#fff8e9" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
    <path d="M157 187 Q162 208 184 213" fill="none" stroke="#d6ae91" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  </g>

  <g id="hair-front" fill="url(#lk-hair)" stroke="#405334" stroke-width="1.8" stroke-linejoin="round">
    <path d="M143 125 Q150 87 185 82 Q229 70 264 100 Q276 111 278 128 Q260 112 244 116 L236 143 L220 123 L199 145 L184 124 L163 145 L153 128 Z"/>
    <path d="M159 99 Q190 77 225 84" fill="none" stroke="#d6edbd" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M207 77 Q196 57 212 43 Q204 61 224 65" fill="none" stroke="#8fb572" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g id="face-features">
    <path d="M166 151 Q175 145 184 151 M226 151 Q235 145 244 151" fill="none" stroke="#765b47" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="176" cy="166" rx="8" ry="10" fill="#2d3328"/>
    <ellipse cx="235" cy="166" rx="8" ry="10" fill="#2d3328"/>
    <circle cx="179" cy="162" r="2.5" fill="#fff8e8"/>
    <circle cx="238" cy="162" r="2.5" fill="#fff8e8"/>
    <path d="M201 173 Q205 176 208 173" fill="none" stroke="#b28269" stroke-width="2" stroke-linecap="round"/>
    <path d="M190 188 Q205 202 222 187" fill="none" stroke="#805344" stroke-width="3" stroke-linecap="round"/>
    <path d="M198 194 Q207 198 215 192" fill="none" stroke="#c47e75" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="163" cy="184" rx="12" ry="6" fill="#d98f7d" opacity="0.35"/>
    <ellipse cx="246" cy="184" rx="12" ry="6" fill="#d98f7d" opacity="0.35"/>
  </g>

  <g id="held-key" transform="rotate(7 327 250)" stroke-linejoin="round">
    <rect x="293" y="214" width="72" height="72" rx="17" fill="#182014" opacity="0.35" transform="translate(2 5)"/>
    <rect x="293" y="211" width="72" height="72" rx="17" fill="url(#lk-key)" stroke="#667a55" stroke-width="2"/>
    <rect x="299" y="217" width="60" height="60" rx="12" fill="none" stroke="#d5e6c4" stroke-opacity="0.22"/>
    <path d="M305 216 Q329 207 351 218" fill="none" stroke="#d9eac8" stroke-opacity="0.4" stroke-linecap="round"/>
    <text x="329" y="259" fill="#edf0e5" font-family="Avenir Next, Futura, sans-serif" font-size="38" font-weight="600" text-anchor="middle">K</text>
  </g>

  <g id="key-highlights" fill="none" stroke-linecap="round">
    <path d="M85 75 Q73 83 70 96" stroke="#8bb9e8" stroke-width="3" opacity="0.75"/>
    <path d="M68 66 L62 56 M81 57 L77 45" stroke="#a6d189" stroke-width="3"/>
    <path d="M324 95 Q339 84 352 91" stroke="#a6d189" stroke-width="3" opacity="0.7"/>
  </g>
</svg>
